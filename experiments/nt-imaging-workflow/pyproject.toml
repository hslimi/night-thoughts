[project]
name = "nt-imaging-workflow"
version = "1.0.0"
description = "Local, human-supervised medical imaging drafting workflow for research and demonstration"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "MIT"}
dependencies = [
  "argon2-cffi==25.1.0",
  "fastapi==0.162.0",
  "httpx==0.28.1",
  "langgraph==1.2.17",
  "langgraph-checkpoint-sqlite==3.1.2",
  "numpy==2.3.5",
  "SimpleITK==2.5.6",
  "pillow==13.0.0",
  "pydantic==2.14.1",
  "pydicom==3.0.2",
  "pyobjc-framework-Quartz==12.2.2; sys_platform == 'darwin'",
  "pyobjc-framework-Vision==12.2.2; sys_platform == 'darwin'",
  "python-dotenv==1.2.4",
  "python-multipart==0.0.32",
  "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
  "mypy==2.4.0",
  "playwright==1.64.1",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.1",
  "ruff==0.17.2",
]

[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nt_imaging"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["real: requires configured real oMLX models"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["scripts/"]
