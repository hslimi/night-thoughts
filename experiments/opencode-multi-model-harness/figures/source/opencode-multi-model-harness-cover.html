<!doctype html>
<html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
body{width:1600px;height:840px;overflow:hidden;background:#0b0f15;color:#e6edf3;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;position:relative}
.glow{position:absolute;inset:0;background:
 radial-gradient(700px 500px at 82% 30%,rgba(168,121,230,.20),transparent 70%),
 radial-gradient(600px 460px at 90% 85%,rgba(91,141,239,.16),transparent 70%),
 radial-gradient(520px 420px at 62% 95%,rgba(217,130,91,.13),transparent 70%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:40px 40px}
.txt{position:absolute;left:96px;top:104px;width:780px}
.kicker{font:600 22px "SF Mono",Menlo,monospace;color:#8b949e;letter-spacing:2px;text-transform:uppercase}
h1{font-size:84px;line-height:1.02;font-weight:800;letter-spacing:-2px;margin-top:26px}
h1 b{background:linear-gradient(90deg,#d9825b,#a879e6 55%,#5b8def);-webkit-background-clip:text;color:transparent}
p{font-size:30px;line-height:1.4;color:#b7c0cb;margin-top:30px}
.pills{display:flex;gap:16px;margin-top:44px}
.pill{font-size:24px;font-weight:700;padding:12px 24px;border-radius:999px;border:2px solid}
.pill.c{border-color:#5b8def;color:#9dbbf5}.pill.b{border-color:#d9825b;color:#efb294}
svg{position:absolute;right:28px;top:60px}
.prov{display:flex;align-items:center;gap:12px;margin-top:34px;font:500 21px "SF Mono",Menlo,monospace;color:#8b949e}
.prov i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-left:14px}
.prov i:first-child{margin-left:0}
</style></head><body>
<div class="glow"></div><div class="grid"></div>
<div class="txt">
  <div class="kicker">OpenCode Desktop · tested</div>
  <h1>One harness.<br><b>Many providers.</b></h1>
  <p>A multi-model coding harness with routing and failover, in two packages built to work together.</p>
  <div class="pills"><span class="pill c">Cheap · open-weight</span><span class="pill b">Best · Claude</span></div>
  <div class="prov"><i style="background:#d9825b"></i>Anthropic<i style="background:#5b8def"></i>DeepSeek<i style="background:#a879e6"></i>OpenRouter</div>
</div>
<svg width="720" height="720" viewBox="0 0 720 720" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">

  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b949e"/></marker></defs>

    <path d="M228 360 C 330 360, 320 170, 400 170"/>

  <circle cx="150" cy="360" r="98" fill="#e6edf3" opacity=".07" filter="url(#s)"/>
  <circle cx="150" cy="360" r="80" fill="#151b23" stroke="#e6edf3" stroke-width="3"/>
  <text x="150" y="352" text-anchor="middle" fill="#e6edf3" font-size="22" font-weight="700">Orchestrator</text>
  <text x="150" y="382" text-anchor="middle" fill="#8b949e" font-size="18">routes by task</text>
  <g>
    <rect x="400" y="132" width="150" height="76" rx="14" fill="#1c2430" stroke="#4a5566" stroke-width="2"/>
    <rect x="400" y="322" width="150" height="76" rx="14" fill="#1c2430" stroke="#4a5566" stroke-width="2"/>
    <rect x="400" y="512" width="150" height="76" rx="14" fill="#1c2430" stroke="#4a5566" stroke-width="2"/>
  </g>
  <g font-size="22" font-weight="700" fill="#e6edf3" text-anchor="middle">
    <text x="475" y="167">Fast</text><text x="475" y="357">Medium</text><text x="475" y="547">Heavy</text>
  </g>
  <g font-size="15" fill="#8b949e" text-anchor="middle">
    <text x="475" y="190">explore</text><text x="475" y="380">implement</text><text x="475" y="570">architect</text>
  </g>
  <g stroke="#8b949e" stroke-width="2.5" stroke-dasharray="7 6" fill="none" marker-end="url(#a)">
    <path d="M552 170 L 586 170"/><path d="M552 360 L 586 360"/><path d="M552 550 L 586 550"/>
  </g>
  <g font-size="16" font-weight="700" text-anchor="middle" fill="#b7c0cb">
    <rect x="592" y="148" width="112" height="44" rx="10" fill="none" stroke="#8b949e" stroke-width="2" stroke-dasharray="7 6"/><text x="648" y="176">backup</text>
    <rect x="592" y="338" width="112" height="44" rx="10" fill="none" stroke="#8b949e" stroke-width="2" stroke-dasharray="7 6"/><text x="648" y="366">backup</text>
    <rect x="592" y="528" width="112" height="44" rx="10" fill="none" stroke="#8b949e" stroke-width="2" stroke-dasharray="7 6"/><text x="648" y="556">backup</text>
  </g>
</svg>
</body></html>
